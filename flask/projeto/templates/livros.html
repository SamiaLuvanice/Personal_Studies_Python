{% extends "base.html" %} {% block conteudo %}
<h2 class="text-center">Lista de Livros</h2>
<hr />
<a href="{{ url_for('adiciona_livro') }}" class="btn btn-primary">Adicionar Livro</a>
<br /><br />
<table class="table table-borded table-hover">
  <thead class="table-dark">
    <tr>
      <th>Id</th>
      <th>Nome</th>
      <th>Descrição</th>
      <th>Valor</th>
      <th>Ações</th>
    </tr>
  </thead>
  <tbody>
    {% for livro in livros %}
    <tr>
      <td>{{ livro.id }}</td>
      <td>{{ livro.nome }}</td>
      <td>{{ livro.descricao }}</td>
      <td>{{ livro.valor }}</td>
      <td>
        <div class="d-flex gap-2">
          <a href="{{ url_for('atualiza_livro', id=livro.id) }}" class="btn btn-secondary btn-sm">Editar</a>
          <form action="{{ url_for('remove_livro', id=livro.id) }}" method="POST" class="m-0">
            <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('Tem certeza que deseja deletar este livro?')">Deletar</button>
          </form>
        </div>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock conteudo %}
