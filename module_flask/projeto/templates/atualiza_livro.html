{%- extends "base.html" -%} {% block conteudo %}

<h2 class="text-center">Atualizar Livro</h2>
<hr>
<form action="{{ url_for('atualiza_livro', id=livro.id) }}" class="form-group" method="POST">
        <label>Nome do Livro</label>
        <input type="text" class="form-control" name="nome" value="{{ livro.nome }}" required>
        <label>Descrição</label>
  <textarea class="form-control" name="descricao" rows="3" required>{{ livro.descricao }}</textarea>
        <label>Valor</label>
        <input type="number" class="form-control" name="valor" value="{{ livro.valor }}" required>
        <button type="submit" class="btn btn-primary">Atualizar</button>
      <a href="{{ url_for('lista_livros') }}" class="btn btn-secondary">Cancelar</a>
    </form>
{% endblock conteudo %}
